# Sized for 13 concurrent builds (one per emulator slot) on a 16-core, 128 GB machine:
# 13 x (3 GB Gradle + 2 GB Kotlin daemon) stays under half the RAM.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.workers.max=4
android.useAndroidX=true
kotlin.code.style=official
